name: CI

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: ['*']

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load cached dependencies
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.0

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

  # internal/api is generated from the pinned spec: generating it again changes
  # nothing unless the spec, or the generator, was changed without `make gen`.
  generated:
    name: The client is generated from the pinned spec
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate the client
        run: make gen

      - name: Check it is current
        run: |
          if ! git diff --exit-code -- internal/api; then
            echo "::error::internal/api is not what the pinned spec generates: run make gen and commit it"
            exit 1
          fi
