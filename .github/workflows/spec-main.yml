name: Spec of hivepaas main

# The CLI against the API the next server release will have: hivepaas's own CI
# checks every change of its spec against the CLI (its cli-compat job); this
# hears about the changes that reached main from this side, weekly.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  spec-check:
    name: The CLI builds against hivepaas main
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout hivepaas
        uses: actions/checkout@v7
        with:
          repository: hivepaas/hivepaas
          ref: main
          path: .hivepaas
          sparse-checkout: docs/openapi

      - name: Check the CLI against its spec
        run: make spec-check SPEC=.hivepaas/docs/openapi/swagger.json
